<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100" role="img" aria-label="Nisha Safari Jeep Tours">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd269" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d4810b" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18382b" />
      <stop offset="100%" stop-color="#081c14" />
    </linearGradient>
  </defs>
  <!-- Emblem Shield / Circle -->
  <g transform="translate(8, 10)">
    <circle cx="40" cy="40" r="37" fill="url(#badgeBg)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="40" cy="40" r="31" fill="none" stroke="#f5a623" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.65" />
    <!-- Stylized Safari Sun & 4x4 Jeep Silhouette -->
    <circle cx="48" cy="27" r="9" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Palm / Acacia Horizon -->
    <path d="M16 52 Q40 46 64 52" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- 4x4 Jeep Icon -->
    <path d="M22 48 L25 36 L44 36 L48 41 L57 41 L59 48 Z" fill="url(#goldGrad)" />
    <rect x="27" y="38" width="7" height="5" rx="1" fill="#0d261c" />
    <rect x="36" y="38" width="7" height="5" rx="1" fill="#0d261c" />
    <circle cx="29" cy="50" r="5.2" fill="#0d261c" stroke="url(#goldGrad)" stroke-width="2.2" />
    <circle cx="51" cy="50" r="5.2" fill="#0d261c" stroke="url(#goldGrad)" stroke-width="2.2" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(98, 0)">
    <text x="0" y="50" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="33" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      NISHA <tspan fill="url(#goldGrad)">SAFARI</tspan>
    </text>
    <line x1="2" y1="60" x2="226" y2="60" stroke="url(#goldGrad)" stroke-width="1.4" opacity="0.75" />
    <text x="2" y="76" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.6" fill="#f5a623">
      JEEP TOURS · SRI LANKA
    </text>
  </g>
</svg>
